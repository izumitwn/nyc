.mapsvg text{font-family:'Nunito',system-ui,sans-serif;fill:#3F4549}
.mapsvg .ttl{font-size:86px;font-weight:700;letter-spacing:-.01em}
.mapsvg .sub{font-size:44px}
.mapsvg .note{font-size:30px;fill:#8B9398}
.mapsvg .place{font-size:34px;fill:#9AA3A8;letter-spacing:.08em}
.mapsvg .place.sm{font-size:24px}
.mapsvg .pinl{font-size:26px;font-weight:700}
.mapsvg .badge{font-size:24px;font-weight:700}
.mapsvg .cT{font-size:32px}

.mapsvg .cD{font-size:28px;fill:#2E6B8E;font-weight:600}
.mapsvg .dh{font-size:46px;font-weight:700}
.mapsvg .dD{font-size:34px}
.mapsvg .dW{font-size:28px;fill:#9AA3A8}
.mapsvg .dP{font-size:32px;fill:#2E6B8E}
.mapsvg .dMe{font-size:29px;fill:#5E8A52;font-weight:600}

/* ---- motion ---- */
.mapsvg .frame{animation:mFade .7s .1s ease-out both}
.mapsvg .isle,.mapsvg .land,.mapsvg .wtr,.mapsvg .park,.mapsvg .zone{animation:mFade .8s .25s ease-out both}
.mapsvg .wtr{animation:mFade .8s .25s ease-out both, mTide 9s 1.2s ease-in-out infinite}
.mapsvg .lead{stroke-dasharray:3 11;animation:mDraw 1.1s ease-out both}
.mapsvg .card{animation:mPop .55s cubic-bezier(.3,1.5,.5,1) both}
.mapsvg .pin{animation:mDrop .5s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:50% 100%}
.mapsvg .pin .halo{animation:mPulse 3.4s ease-out infinite}
.mapsvg .row{animation:mFade .5s ease-out both}
@keyframes mFade{from{opacity:0}to{opacity:1}}
@keyframes mTide{0%,100%{opacity:1}50%{opacity:.82}}
@keyframes mDraw{from{opacity:0;stroke-dashoffset:260}to{opacity:.85;stroke-dashoffset:0}}
@keyframes mPop{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes mDrop{from{opacity:0;transform:translateY(-26px) scale(.8)}to{opacity:1;transform:none}}
@keyframes mPulse{0%{opacity:.22;r:6}60%{opacity:0;r:34}100%{opacity:0;r:34}}

#map{padding-top:22px}
.mapwrap{border:var(--line);border-radius:var(--radius);box-shadow:var(--shadow);background:#FBFCFB;overflow:hidden}
.mapsvg{display:block;width:100%;height:auto}
:root{
  --paper:#FBFCFB;
  --ink:#3F4549;
  --ink-soft:#737B80;
  --coral:#9EC3D8;
  --yellow:#D9E4DF;
  --aqua:#CFE4EE;
  --green:#B7D3B4;
  --line:3px solid var(--ink);
  --radius:22px;
  --radius-sm:14px;
  --shadow:4px 4px 0 var(--ink);
  --nav-h:58px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:16px;line-height:1.65;
  padding-top:var(--nav-h);
}
a{color:inherit}
button{font-family:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
section{scroll-margin-top:calc(var(--nav-h) + 12px);padding:28px 0 8px}

/* ---------- nav ---------- */
.nav{
  position:fixed;inset:0 0 auto 0;height:var(--nav-h);z-index:50;
  background:var(--paper);border-bottom:var(--line);
}
.nav-inner{max-width:760px;margin:0 auto;height:100%;display:flex;align-items:center;gap:10px;padding:0 12px}
.brand{display:flex;align-items:center;gap:6px;font-size:17px;white-space:nowrap;text-decoration:none}
.brand svg{width:30px;height:30px;flex:none}
.nav-links{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-left:auto;padding:4px 2px}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{
  flex:none;text-decoration:none;font-size:14px;padding:4px 12px;
  border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);
}
.nav-links a:hover,.nav-links a:focus-visible{background:var(--yellow);outline:none}
.nav-links a.on{background:var(--aqua)}

/* ---------- common ---------- */
.card{
  background:var(--paper);border:var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:18px;
}
.sec-title{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:22px;font-weight:normal}
.sec-title svg{width:40px;height:40px;flex:none}
.muted{color:var(--ink-soft);font-size:14px}
.pill{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:0 10px;font-size:13px;line-height:22px;background:var(--paper)}

/* ---------- hero ---------- */
.hero{padding-top:18px}
.hero-card{padding:0;overflow:hidden}
.hero-art{display:block;width:100%;height:auto;background:var(--paper);border-bottom:var(--line)}
.hero-body{padding:18px 18px 20px;text-align:center}
.hero h1{margin:0;font-size:26px;font-weight:normal;letter-spacing:.04em}
.hero .sub{margin:4px 0 14px;color:var(--ink-soft)}
.count{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.count .box{
  min-width:72px;border:var(--line);border-radius:var(--radius-sm);padding:6px 8px;background:var(--paper)
}
.count .box:nth-child(1){background:var(--coral)}
.count .box:nth-child(2){background:var(--yellow)}
.count .box:nth-child(3){background:var(--aqua)}
.count .num{display:block;font-size:28px;line-height:1.2}
.count .lab{font-size:13px}
.count-note{margin:12px 0 0;font-size:14px}

/* hero motion */
.cloud{animation:drift 9s ease-in-out infinite alternate}
.cloud.c2{animation-duration:12s;animation-delay:-3s}
.hero-art .plane{animation:float 4s ease-in-out infinite}
.hero-art .taxi{animation:bob 1.6s ease-in-out infinite}
.sun{transform-origin:62px 52px;animation:spin 30s linear infinite}
.flake{animation:snow 6s linear infinite}
.flake:nth-of-type(2n){animation-duration:8s;animation-delay:-2s}
.flake:nth-of-type(3n){animation-duration:7s;animation-delay:-4s}
.torch{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.8s ease-in-out infinite}
@keyframes drift{from{transform:translateX(-10px)}to{transform:translateX(14px)}}
@keyframes float{0%,100%{transform:translate(0,0) rotate(-2deg)}50%{transform:translate(6px,-6px) rotate(2deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes snow{from{transform:translateY(-20px)}to{transform:translateY(230px)}}
@keyframes flick{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

/* ---------- flights ---------- */
.flights{display:grid;gap:14px}
.flight{display:grid;gap:8px;padding:14px 16px}
.flight:nth-child(1){background:#F0F6F9}
.flight:nth-child(2){background:#F3F6F4}
.flight:nth-child(3){background:#EEF7FB}
.flight:nth-child(4){background:#F1F6F0}
.f-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.f-no{font-size:18px}
.f-route{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.f-code{font-size:26px;line-height:1.1}
.f-time{font-size:15px}
.f-city{font-size:12px;color:var(--ink-soft)}
.f-mid svg{width:64px;height:22px}
.f-meta{display:flex;gap:8px;flex-wrap:wrap}
.booking{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:14px}

/* ---------- days ---------- */
.day-tabs{
  display:flex;gap:8px;overflow-x:auto;padding:6px 4px 12px;margin:0 -4px;
  scroll-snap-type:x proximity;scrollbar-width:thin;
}
.day-tab{
  flex:none;scroll-snap-align:start;
  border:var(--line);border-radius:16px;background:var(--paper);
  padding:6px 10px;min-width:62px;text-align:center;cursor:pointer;line-height:1.25;
  box-shadow:3px 3px 0 var(--ink);transition:transform .15s;
}
.day-tab .d{display:block;font-size:17px}
.day-tab .w{display:block;font-size:12px;color:var(--ink-soft)}
.day-tab[aria-selected="true"]{background:var(--yellow);transform:translateY(-3px)}
.day-tab[data-city="nyc"] .dot{background:var(--coral)}
.day-tab[data-city="bos"] .dot{background:var(--green)}
.day-tab[data-city="air"] .dot{background:var(--aqua)}
.day-tab .dot{display:inline-block;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink);margin-top:3px}
.day-tab:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}

.day-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.day-head svg{width:64px;height:64px;flex:none}
.day-head h3{margin:0;font-size:20px;font-weight:normal}
.day-head .where{font-size:14px;color:var(--ink-soft)}
.day-info{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}

.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:58px;top:8px;bottom:8px;border-left:3px dashed var(--ink)}
.tl{display:grid;grid-template-columns:48px 1fr;gap:20px;margin-bottom:12px;position:relative}
.tl-time{font-size:15px;text-align:right;padding-top:12px}
.tl-dot{
  position:absolute;left:51px;top:14px;width:17px;height:17px;border-radius:50%;
  border:3px solid var(--ink);background:var(--paper);
}
.tl.must .tl-dot{background:var(--coral)}
.tl.opt .tl-dot{background:var(--green)}
.tl-card{border:var(--line);border-radius:var(--radius-sm);padding:10px 12px;background:var(--paper)}
.tl.must .tl-card{background:#EEF5F9}
.tl-title{font-size:17px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.badge{font-size:12px;line-height:20px;padding:0 8px;border:2px solid var(--ink);border-radius:999px}
.badge.must{background:var(--coral)}
.badge.opt{background:var(--green)}
.badge.free{background:var(--yellow)}
.tl-note{margin:4px 0 0;font-size:14px;color:#545C61}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:12px;line-height:20px;padding:0 8px;border-radius:999px;border:2px solid var(--ink)}
.tag.subway{background:var(--aqua)}
.tag.walk{background:var(--green)}
.tag.train{background:var(--yellow)}
.tag.plane{background:var(--coral)}
.tag.ferry{background:#E3EEF2}
.tag.taxi{background:#E4E7E6}
.tl-foot{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px;margin-top:6px}
.tl-foot .tags{margin-top:0}
.maplink{display:inline-flex;align-items:center;justify-content:center;gap:5px;margin-left:auto;padding:3px 10px;font-size:16px;line-height:22px;text-decoration:none;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);box-shadow:2px 2px 0 var(--ink)}
.food{margin-top:18px}
.food h4{margin:0 0 8px;font-size:17px}
.food ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.food-card{border:2px dashed var(--ink);border-radius:var(--radius-sm);padding:10px 12px;background:var(--paper);display:flex;flex-direction:column}
.food-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.food-top b{font-weight:400;font-size:16px}
.res{font-size:12.5px;padding:1px 9px;border:2px solid var(--ink);border-radius:999px;background:var(--paper)}
.res-must{background:var(--coral)}
.res-can{background:var(--yellow)}
.food-what{margin:4px 0 0;font-size:14px}
.food-area{margin:2px 0 6px;font-size:13px;color:#545C61}
.food-card .maplink{align-self:flex-end}
main > section[hidden]{display:none!important}
main > section.page{min-height:calc(100vh - var(--nav-h))}
.spot-list{display:grid;gap:14px}
.spot{scroll-margin-top:calc(var(--nav-h) + 12px)}
.spot h3{margin:4px 0 6px;font-size:19px}
.spot .intro{margin:0 0 10px;font-size:15px;line-height:1.7}
.spot figure{margin:0 0 12px}
.spot figure[hidden]{display:none}
.spot figure img{display:block;width:auto;height:auto;max-width:100%;max-height:440px;border-radius:var(--radius-sm)}
.spot figcaption{font-size:12.5px;color:#545C61;margin-top:4px}
.spot h4{margin:0 0 4px;font-size:15px}
.spot ul{margin:0 0 8px;padding-left:20px;font-size:14.5px;line-height:1.7}
.spot .tip{margin:0 0 8px;font-size:13.5px;color:#545C61}
.spot .back{font-size:13.5px}
.spotlink{display:inline-flex;align-items:center;justify-content:center;margin-left:auto;padding:3px 10px;font-size:16px;line-height:22px;text-decoration:none;border:2.5px solid var(--ink);border-radius:999px;background:var(--yellow);box-shadow:2px 2px 0 var(--ink)}
.spotlink:hover,.spotlink:focus-visible{background:var(--aqua);outline:none}
.spotlink:active{transform:translate(2px,2px);box-shadow:none}
.foot-btns{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-left:auto}
.foot-btns .maplink,.foot-btns .spotlink{margin-left:0}
.maplink svg{width:16px;height:16px;flex:none}
.maplink:hover,.maplink:focus-visible{background:var(--aqua);outline:none}
.maplink:active{transform:translate(2px,2px);box-shadow:none}
.tl.sunset .tl-card{background:#FDF3D8;border-style:dashed}
.tl.sunset .tl-title{font-size:15px;color:#6B5A2A;display:flex;align-items:center;gap:8px}
.sun-ico{width:26px;height:17px;flex:none}
.tl-dot.sun-dot{background:var(--yellow)}
.stamp{text-align:right;font-size:12px;color:var(--ink-soft);padding:14px 2px 0;letter-spacing:.02em}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

.bounce .day-head,.bounce .day-info,.bounce .tl{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.bounce .tl:nth-child(2){animation-delay:.05s}
.bounce .tl:nth-child(3){animation-delay:.1s}
.bounce .tl:nth-child(4){animation-delay:.15s}
.bounce .tl:nth-child(5){animation-delay:.2s}
.bounce .tl:nth-child(n+6){animation-delay:.25s}
@keyframes pop{0%{opacity:0;transform:translateY(14px) scale(.96)}70%{opacity:1;transform:translateY(-4px) scale(1.01)}100%{transform:none}}

/* ---------- todo ---------- */
.progress{height:18px;border:var(--line);border-radius:999px;overflow:hidden;background:var(--paper);margin:4px 0 14px}
.progress span{display:block;height:100%;background:var(--green);border-right:3px solid var(--ink);width:0;transition:width .35s}
.todo-group{margin-bottom:16px}
.todo-group h3{margin:0 0 6px;font-size:16px;font-weight:normal;display:inline-block;padding:0 12px;border:2.5px solid var(--ink);border-radius:999px}
.todo-group:nth-child(1) h3{background:var(--aqua)}
.todo-group:nth-child(2) h3{background:var(--yellow)}
.todo-group:nth-child(3) h3{background:var(--coral)}
.todo-group:nth-child(4) h3{background:var(--green)}
.todo-list{list-style:none;margin:0;padding:0}
.todo-list li{border-bottom:2px dotted #C9CFD2}
.todo-list label{display:flex;align-items:flex-start;gap:10px;padding:9px 2px;cursor:pointer}
.todo-list input{
  appearance:none;-webkit-appearance:none;flex:none;margin:2px 0 0;
  width:22px;height:22px;border:3px solid var(--ink);border-radius:7px;background:var(--paper);
  display:grid;place-content:center;cursor:pointer;
}
.todo-list input::after{content:"";width:10px;height:6px;border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(-45deg) translate(1px,-1px) scale(0);transition:transform .15s}
.todo-list input:checked{background:var(--yellow)}
.todo-list input:checked::after{transform:rotate(-45deg) translate(1px,-1px) scale(1)}
.todo-list input:focus-visible{outline:3px dashed var(--ink);outline-offset:2px}
.todo-list input:checked + span{text-decoration:line-through;color:var(--ink-soft)}
.todo-list small{display:block;color:var(--ink-soft);font-size:12.5px}

/* ---------- stay ---------- */
.life-list{display:grid;gap:14px}
.life h3{margin:0 0 10px;font-size:19px}
.life p{margin:0 0 10px;font-size:15px;line-height:1.75}
.life ul{margin:0;padding-left:20px;font-size:14.5px;line-height:1.8}
.life b{font-weight:400;background:var(--yellow);padding:0 3px;border-radius:3px}
.life-place{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:2px dashed var(--ink);border-radius:var(--radius-sm);padding:10px 12px;margin:0 0 10px;font-size:14.5px}
.life-place .maplink{margin-left:auto}
.stays{display:grid;gap:14px}
.stay{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:start;padding:14px}
.stay svg{width:56px;height:56px}
.stay h3{margin:0;font-size:17px;font-weight:normal}
.stay p{margin:2px 0;font-size:14px}
.stay .when{display:inline-block;margin-bottom:2px}
.stay:nth-child(odd) .when{background:var(--aqua)}
.stay:nth-child(even) .when{background:var(--green)}
.warn{background:var(--coral)}

footer{text-align:center;padding:30px 16px 40px;font-size:13px;color:var(--ink-soft)}
footer svg{width:120px;height:auto;display:block;margin:0 auto 6px}

@media (min-width:640px){
  .flights{grid-template-columns:1fr 1fr}
  .stays{grid-template-columns:1fr 1fr}
  .hero h1{font-size:36px}
}

@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none !important;transition:none !important}
}

    {d:"1/5", w:"Tue", city:"nyc", sun:"16:43", icon:"book", title:"Downtown on foot", where:"Lower East Side · SoHo · Greenwich Village", items:[
      {t:"10:30", title:"Tenement Museum"},
      {t:"12:00", title:"Metrograph"},
      {t:"12:45", title:"SoHo"},
      {t:"15:30", title:"Washington Square Park and Greenwich Village"},
      {t:"16:15", title:"NYU Tisch School of the Arts"},
      {t:"17:00", title:"Strand Bookstore"}
    ]},
    {d:"1/6", w:"Wed", city:"nyc", sun:"16:44", icon:"theater", title:"Street art, then a Broadway show", where:"Brooklyn → Theater District", items:[
      {t:"11:00", title:"Williamsburg"},
      {t:"14:30", title:"The Bushwick Collective"},
      {t:"19:00", title:"Broadway show"}
    ]},
    {d:"1/7", w:"Thu", city:"nyc", sun:"16:45", icon:"paint", title:"A whole day at MoMA", where:"Midtown · 53rd St → Flatiron", items:[
      {t:"10:30", title:"MoMA"},
      {t:"17:30", title:"Ellen's Stardust Diner"},
      {t:"18:45", title:"Harry Potter New York"}
    ]},
    {d:"1/8", w:"Fri", city:"nyc", sun:"16:45", icon:"city", title:"High Line to sunset", where:"Chelsea → Midtown", items:[
      {t:"10:00", title:"The High Line"},
      {t:"12:00", title:"Chelsea Market"},
      {t:"13:30", title:"Little Island"},
      {t:"16:00", title:"SUMMIT One Vanderbilt, for sunset"}
    ]}
  ];

  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

  var tabs = document.getElementById("day-tabs");
  var panel = document.getElementById("day-panel");
  tabs.innerHTML = days.map(function(day, i){
    return '<button class="day-tab" role="tab" id="tab-' + i + '" aria-controls="day-panel" aria-selected="false" data-i="' + i + '" data-city="' + day.city + '" tabindex="-1">' +
      '<span class="d">' + day.d + '</span><span class="w">' + day.w + '</span><span class="dot"></span></button>';
  }).join("");

  /* Slot sunset into the timeline; vague times sort to the end */
  var WORD_TIME = {"Morning":9*60, "Daytime":12*60, "Afternoon":14*60, "Evening":20*60, "All day":0, "After 21:00":21*60};
  function mins(t){
    var m = /^(\d{1,2}):(\d{2})$/.exec(t);
    if (m) return (+m[1]) * 60 + (+m[2]);
    return WORD_TIME.hasOwnProperty(t) ? WORD_TIME[t] : 1439;
  }
  function withSunset(day){
    if (!day.sun) return day.items;
    var out = day.items.slice(), s = mins(day.sun), at = out.length;
    for (var k = 0; k < out.length; k++){
      if (mins(out[k].t) > s){ at = k; break; }
    }
    out.splice(at, 0, {sunset: true, t: day.sun});
    return out;
  }

  function render(i, animate){
    var day = days[i];
    Array.prototype.forEach.call(tabs.children, function(b, j){
      b.setAttribute("aria-selected", j === i ? "true" : "false");
      b.tabIndex = j === i ? 0 : -1;
    });
    panel.setAttribute("aria-labelledby", "tab-" + i);
    var html = '<div class="day-head">' + icons[day.icon] +
      '<div><h3>' + esc(day.d) + ' · ' + day.w + '</h3><div class="where">' + esc(day.where) + '</div></div></div>' +
      '<ol class="timeline">' + withSunset(day).map(function(it){
        if (it.sunset) return '<li class="tl sunset"><div class="tl-time">' + esc(it.t) + '</div>' +
          '<span class="tl-dot sun-dot" aria-hidden="true"></span>' +
          '<div class="tl-card"><div class="tl-title"><svg class="sun-ico" viewBox="0 0 32 20" aria-hidden="true">' +
          '<path d="M3 15 h26" stroke="#6B5A2A" stroke-width="2.2" stroke-linecap="round"/>' +
          '<path d="M16 15 a6 6 0 0 1 12 0" fill="#F2C94C" stroke="#6B5A2A" stroke-width="2.2" stroke-linejoin="round" transform="translate(-6 0)"/>' +
          '<path d="M16 3 v2.5 M7.5 6.5 l1.8 1.8 M24.5 6.5 l-1.8 1.8" stroke="#6B5A2A" stroke-width="2.2" stroke-linecap="round"/>' +
          '<path d="M13 19 l2-2.5 M19 19 l-2-2.5" stroke="#6B5A2A" stroke-width="2" stroke-linecap="round"/>' +
          '</svg>Sunset</div></div></li>';
        /* One line per stop: time and place only */
        return '<li class="tl"' + (it.spot ? ' id="item-' + it.spot + '"' : "") + '><div class="tl-time">' + esc(it.t) + '</div>' +
          '<span class="tl-dot" aria-hidden="true"></span>' +
          '<div class="tl-card"><div class="tl-title">' + esc(it.title) + '</div></div></li>';
      }).join("") + '</ol>';
    panel.innerHTML = html;
    if (animate && !reduceMotion){
      panel.classList.remove("bounce");
      void panel.offsetWidth;
      panel.classList.add("bounce");
    }
  }

  function centerTab(i, smooth){
    var b = tabs.children[i];
    var left = b.offsetLeft - (tabs.clientWidth - b.offsetWidth) / 2;
    if (tabs.scrollTo) tabs.scrollTo({left: left, behavior: (smooth && !reduceMotion) ? "smooth" : "auto"});
    else tabs.scrollLeft = left;
  }
  tabs.style.position = "relative";

  tabs.addEventListener("click", function(e){
    var b = e.target.closest(".day-tab");
    if (!b) return;
    var i = +b.dataset.i;
    render(i, true);
    centerTab(i, true);
  });
  tabs.addEventListener("keydown", function(e){
    var cur = +(document.activeElement.dataset && document.activeElement.dataset.i);
    if (isNaN(cur)) return;
    var next = null;
    if (e.key === "ArrowRight") next = Math.min(days.length - 1, cur + 1);
    if (e.key === "ArrowLeft") next = Math.max(0, cur - 1);
    if (e.key === "Home") next = 0;
    if (e.key === "End") next = days.length - 1;
    if (next === null) return;
    e.preventDefault();
    render(next, true);
    tabs.children[next].focus();
    centerTab(next, true);
  });

  /* Which day opens by default:
       before the trip  -> the first day
       during the trip  -> today
       after the trip   -> the last day
     The d values carry no year, so months Jul-Dec belong to TRIP_YEAR
     and months Jan-Jun to the year after. */
  var TRIP_YEAR = 2026;
  (function(){
    function dayDate(d){
      var p = String(d).split("/");
      var m = +p[0], dd = +p[1];
      return new Date(m >= 7 ? TRIP_YEAR : TRIP_YEAR + 1, m - 1, dd);
    }
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var last = days.length - 1;
    var start = last;
    for (var i = 0; i <= last; i++){
      if (dayDate(days[i].d) >= today){ start = i; break; }
    }
    render(start, false);
    setTimeout(function(){ centerTab(start, false); }, 50);
  })();

  /* home + itinerary only */
  var PAGES = ["map"];
  function route(){
    var h = location.hash.slice(1);
    var page = h.indexOf("spot-") === 0 ? "spots" : (PAGES.indexOf(h) >= 0 ? h : "home");
    Array.prototype.forEach.call(document.querySelectorAll("main > section"), function(sec){
      var show = page === "home" ? sec.id === "days" : sec.id === page;
      sec.hidden = !show;
      sec.classList.toggle("page", page !== "home" && show);
    });
    document.querySelectorAll(".nav-links a").forEach(function(a){
      var t = a.getAttribute("href").slice(1);
      a.classList.toggle("on", t === page || (page === "home" && t === "days"));
    });
    var el = h ? document.getElementById(decodeURIComponent(h)) : null;
    requestAnimationFrame(function(){
      if (el && h === "days") el.scrollIntoView({block: "start"});
      else window.scrollTo(0, 0);
    });
  }
  window.addEventListener("hashchange", route);
  route();

})();
</script>

    }
  });
</script>
